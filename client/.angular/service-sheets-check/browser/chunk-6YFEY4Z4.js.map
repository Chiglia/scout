<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
  *transloco="let t"
>
  <div
    class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4"
  >
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900">
        {{ t('commitments.title', { name: scoutName() }) }}
      </h3>
      <button
        type="button"
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-700 cursor-pointer"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-medium text-slate-700 mb-1">{{ t('commitments.day') }}</label>
        <select
          [(ngModel)]="formData.day"
          class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800"
        >
          <option value="monday">{{ t('days.monday') }}</option>
          <option value="tuesday">{{ t('days.tuesday') }}</option>
          <option value="wednesday">{{ t('days.wednesday') }}</option>
          <option value="thursday">{{ t('days.thursday') }}</option>
          <option value="friday">{{ t('days.friday') }}</option>
          <option value="saturday">{{ t('days.saturday') }}</option>
          <option value="sunday">{{ t('days.sunday') }}</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">{{ t('commitments.start') }}</label>
          <input
            type="time"
            [(ngModel)]="formData.startTime"
            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
          />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">{{ t('commitments.end') }}</label>
          <input
            type="time"
            [(ngModel)]="formData.endTime"
            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
          />
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer"
      >
        {{ t('common.cancel') }}
      </button>
      <button
        type="button"
        (click)="submit()"
        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-2xs cursor-pointer"
      >
        {{ t('common.save') }}
      </button>
    </div>
  </div>
</div>
