<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs" *transloco="let t">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center font-bold shadow-xs"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C11.5 5 9.5 8 7 9C8.5 10 9.5 11.5 10 13C8 12.5 5.5 13 4 15C6 16.5 8.5 15.5 10.5 14C10.8 16 10.5 18.5 9 20C11 19.5 11.8 17.5 12 15C12.2 17.5 13 19.5 15 20C13.5 18.5 13.2 16 13.5 14C15.5 15.5 18 16.5 20 15C18.5 13 16 12.5 14 13C14.5 11.5 15.5 10 17 9C14.5 8 12.5 5 12 2Z"
            />
            <circle cx="12" cy="21.5" r="1" />
          </svg>
        </div>
        <div>
          <span class="text-lg font-bold tracking-tight text-slate-900 block leading-tight">{{
            t('app.title')
          }}</span>
          <span class="text-xs text-slate-500 font-medium hidden sm:block">{{
            t('app.subtitle')
          }}</span>
        </div>
      </div>

      <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
        <button
          type="button"
          (click)="tabChange.emit('dashboard')"
          [class]="
            activeTab() === 'dashboard'
              ? 'bg-white text-slate-900 font-semibold shadow-xs'
              : 'text-slate-600 hover:text-slate-900 font-medium'
          "
          class="px-3.5 py-1.5 text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer flex items-center gap-1.5"
        >
          <i class="pi pi-th-large text-xs"></i> {{ t('app.nav.dashboard') }}
        </button>
        <button
          type="button"
          (click)="tabChange.emit('members')"
          [class]="
            activeTab() === 'members'
              ? 'bg-white text-slate-900 font-semibold shadow-xs'
              : 'text-slate-600 hover:text-slate-900 font-medium'
          "
          class="px-3.5 py-1.5 text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer flex items-center gap-1.5"
        >
          <i class="pi pi-users text-xs"></i> {{ t('app.nav.members') }}
          <span
            class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700 font-mono"
            >{{ clanData.members().length }}</span
          >
        </button>
        <button
          type="button"
          (click)="tabChange.emit('services')"
          [class]="
            activeTab() === 'services'
              ? 'bg-white text-slate-900 font-semibold shadow-xs'
              : 'text-slate-600 hover:text-slate-900 font-medium'
          "
          class="px-3.5 py-1.5 text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer flex items-center gap-1.5"
        >
          <i class="pi pi-heart text-xs"></i> {{ t('app.nav.services') }}
          <span
            class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700 font-mono"
            >{{ clanData.services().length }}</span
          >
        </button>
        <button
          type="button"
          (click)="tabChange.emit('matrix')"
          [class]="
            activeTab() === 'matrix'
              ? 'bg-blue-600 text-white font-semibold shadow-xs'
              : 'text-slate-600 hover:text-slate-900 font-medium'
          "
          class="px-3.5 py-1.5 text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer flex items-center gap-1.5"
        >
          <i class="pi pi-check-circle text-xs"></i> {{ t('app.nav.matrix') }}
        </button>
        <button
          type="button"
          (click)="tabChange.emit('schedule')"
          [class]="
            activeTab() === 'schedule'
              ? 'bg-white text-slate-900 font-semibold shadow-xs'
              : 'text-slate-600 hover:text-slate-900 font-medium'
          "
          class="px-3.5 py-1.5 text-xs rounded-lg transition-colors whitespace-nowrap cursor-pointer flex items-center gap-1.5"
        >
          <i class="pi pi-calendar text-xs"></i> {{ t('app.nav.schedule') }}
        </button>
      </nav>

      <div class="flex items-center gap-2">
        <a routerLink="/service-sheets" [attr.title]="t('sheets.title')" [attr.aria-label]="t('sheets.title')"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">
          <i class="pi pi-print" aria-hidden="true"></i><span class="hidden xl:inline">{{ t('sheets.title') }}</span>
        </a>
        <button
          type="button"
          (click)="openImport.emit()"
          class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors shadow-2xs cursor-pointer"
        >
          <i class="pi pi-file-import text-xs text-blue-600"></i> {{ t('app.actions.importData') }}
        </button>
        <button
          type="button"
          (click)="openWhatsApp.emit()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg hover:bg-emerald-100 transition-colors shadow-2xs cursor-pointer"
        >
          <i class="pi pi-whatsapp text-xs text-emerald-600"></i>
          <span class="hidden md:inline">{{ t('app.actions.exportWhatsApp') }}</span>
        </button>
        <div
          class="flex items-center border border-slate-200 rounded-lg p-0.5 bg-slate-50 text-xs font-medium"
        >
          <button
            type="button"
            (click)="setLanguage('it')"
            [class]="
              currentLang === 'it'
                ? 'bg-white text-slate-900 shadow-2xs font-bold'
                : 'text-slate-500 hover:text-slate-800'
            "
            class="px-2 py-1 rounded transition-colors cursor-pointer"
          >
            IT
          </button>
          <button
            type="button"
            (click)="setLanguage('en')"
            [class]="
              currentLang === 'en'
                ? 'bg-white text-slate-900 shadow-2xs font-bold'
                : 'text-slate-500 hover:text-slate-800'
            "
            class="px-2 py-1 rounded transition-colors cursor-pointer"
          >
            EN
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Sub-bar -->
    <div
      class="flex md:hidden items-center justify-between border-t border-slate-100 py-2 overflow-x-auto gap-2"
    >
      <button
        type="button"
        (click)="tabChange.emit('dashboard')"
        [class]="
          activeTab() === 'dashboard'
            ? 'text-blue-600 font-bold border-b-2 border-blue-600'
            : 'text-slate-600'
        "
        class="px-2 py-1 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.dashboard') }}
      </button>
      <button
        type="button"
        (click)="tabChange.emit('members')"
        [class]="
          activeTab() === 'members'
            ? 'text-blue-600 font-bold border-b-2 border-blue-600'
            : 'text-slate-600'
        "
        class="px-2 py-1 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.members') }} ({{ clanData.members().length }})
      </button>
      <button
        type="button"
        (click)="tabChange.emit('services')"
        [class]="
          activeTab() === 'services'
            ? 'text-blue-600 font-bold border-b-2 border-blue-600'
            : 'text-slate-600'
        "
        class="px-2 py-1 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.services') }} ({{ clanData.services().length }})
      </button>
      <button
        type="button"
        (click)="tabChange.emit('matrix')"
        [class]="
          activeTab() === 'matrix'
            ? 'text-blue-600 font-bold border-b-2 border-blue-600'
            : 'text-slate-600'
        "
        class="px-2 py-1 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.matrix') }}
      </button>
      <button
        type="button"
        (click)="tabChange.emit('schedule')"
        [class]="
          activeTab() === 'schedule'
            ? 'text-blue-600 font-bold border-b-2 border-blue-600'
            : 'text-slate-600'
        "
        class="px-2 py-1 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.schedule') }}
      </button>
    </div>
  </div>
</header>
