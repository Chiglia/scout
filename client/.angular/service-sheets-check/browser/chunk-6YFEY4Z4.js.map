<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
  *transloco="let t"
>
  <div
    class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 space-y-4"
  >
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-file-import text-blue-600 text-base"></i>
        <h3 class="text-base font-bold text-slate-900">{{ t('import.title') }}</h3>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-700 cursor-pointer"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <p class="text-xs text-slate-600 leading-relaxed">{{ t('import.csvInstructions') }}</p>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">{{
        t('import.pasteLabel')
      }}</label>
      <textarea
        rows="7"
        [(ngModel)]="csvText"
        [placeholder]="t('import.examplePlaceholder')"
        class="w-full p-3 font-mono text-xs bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500"
      ></textarea>
    </div>

    @if (importResult; as res) {
      <div
        class="p-3 rounded-xl border text-xs"
        [ngClass]="
          res.errors.length === 0
            ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
            : 'bg-red-50 border-red-200 text-red-800'
        "
      >
        <span class="font-bold block">{{
          t('import.result', {
            commitments: res.importedCommitmentsCount,
            members: res.importedMembersCount,
          })
        }}</span>
        @if (res.errors.length > 0) {
          <ul class="list-disc pl-4 mt-1 space-y-0.5 text-[11px]">
            @for (err of res.errors; track $index) {
              <li class="whitespace-pre-line">{{ err }}</li>
            }
          </ul>
        }
      </div>
    }

    <div class="flex items-center justify-between pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="loadDemo.emit()"
        class="text-xs text-blue-600 hover:text-blue-800 font-medium cursor-pointer"
      >
        {{ t('import.loadDemoAlternative') }}
      </button>
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="close.emit()"
          class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer"
        >
          {{ t('common.close') }}
        </button>
        <button
          type="button"
          (click)="process()"
          class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-2xs cursor-pointer"
        >
          {{ t('import.btnProcess') }}
        </button>
      </div>
    </div>
  </div>
</div>
