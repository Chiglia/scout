<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
  *transloco="let t"
>
  <div
    class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4"
  >
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900">
        {{ formData.id ? t('members.editMember') : t('members.addMember') }}
      </h3>
      <button
        type="button"
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-700 cursor-pointer"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">{{ t('commitments.name') }} *</label>
          <input
            type="text"
            [(ngModel)]="formData.name"
            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500"
            placeholder="es. Matteo"
          />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Cognome</label>
          <input
            type="text"
            [(ngModel)]="formData.surname"
            class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500"
            placeholder="es. Rossi"
          />
        </div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">{{ t('members.notes') }}</label>
        <textarea
          rows="2"
          [(ngModel)]="formData.notes"
          class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
          placeholder="es. Automunito..."
        ></textarea>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer"
      >
        {{ t('common.cancel') }}
      </button>
      <button
        type="button"
        (click)="submit()"
        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-2xs cursor-pointer"
      >
        {{ t('common.save') }}
      </button>
    </div>
  </div>
</div>
