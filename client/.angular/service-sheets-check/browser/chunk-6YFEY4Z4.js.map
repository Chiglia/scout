<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs"
  *transloco="let t"
>
  <div
    class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 space-y-4"
  >
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-whatsapp text-emerald-600 text-lg"></i>
        <h3 class="text-base font-bold text-slate-900">{{ t('modals.whatsAppTitle') }}</h3>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-700 cursor-pointer"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <p class="text-xs text-slate-500">
      {{ t('modals.whatsAppSubtitle') }}
    </p>

    <textarea
      readonly
      rows="11"
      [value]="text()"
      class="w-full p-3 font-mono text-xs bg-slate-50 border border-slate-300 rounded-xl text-slate-800"
    ></textarea>

    <div class="flex items-center justify-between pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer"
      >
        {{ t('common.close') }}
      </button>
      <button
        type="button"
        (click)="copy()"
        class="px-4 py-2 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-2xs cursor-pointer flex items-center gap-1.5"
      >
        <i class="pi pi-copy text-xs"></i> {{ t('modals.copyClipboard') }}
      </button>
    </div>
  </div>
</div>
