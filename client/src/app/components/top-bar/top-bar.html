<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs" *transloco="let t">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-3 h-16">
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <div
          class="w-10 h-10 shrink-0 rounded-xl bg-amber-600 text-white flex items-center justify-center font-bold shadow-xs"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C11.5 5 9.5 8 7 9C8.5 10 9.5 11.5 10 13C8 12.5 5.5 13 4 15C6 16.5 8.5 15.5 10.5 14C10.8 16 10.5 18.5 9 20C11 19.5 11.8 17.5 12 15C12.2 17.5 13 19.5 15 20C13.5 18.5 13.2 16 13.5 14C15.5 15.5 18 16.5 20 15C18.5 13 16 12.5 14 13C14.5 11.5 15.5 10 17 9C14.5 8 12.5 5 12 2Z"
            />
            <circle cx="12" cy="21.5" r="1" />
          </svg>
        </div>
        <div class="min-w-0">
          <span class="block truncate text-lg font-bold leading-tight tracking-tight text-slate-900">{{
            t('app.title')
          }}</span>
          <span class="text-xs text-slate-500 font-medium hidden sm:block">{{
            t('app.subtitle')
          }}</span>
        </div>
      </div>

      <nav class="hidden shrink-0 items-center gap-1 rounded-xl bg-slate-100 p-1 lg:flex">
        <button
          type="button"
          (click)="tabChange.emit('dashboard')"
          [class]="
            activeTab() === 'dashboard'
              ? 'bg-white text-blue-700 font-semibold shadow-xs'
              : 'text-slate-600 hover:bg-white/70 hover:text-slate-900 font-medium'
          "
          class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-xs transition-colors whitespace-nowrap cursor-pointer"
        >
          <i class="pi pi-th-large text-xs"></i> {{ t('app.nav.dashboard') }}
        </button>
        <button
          type="button"
          (click)="tabChange.emit('members')"
          [class]="
            activeTab() === 'members'
              ? 'bg-white text-blue-700 font-semibold shadow-xs'
              : 'text-slate-600 hover:bg-white/70 hover:text-slate-900 font-medium'
          "
          class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-xs transition-colors whitespace-nowrap cursor-pointer"
        >
          <i class="pi pi-users text-xs"></i> {{ t('app.nav.members') }}
          <span
            class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700 font-mono"
            >{{ clanData.members().length }}</span
          >
        </button>
        <button
          type="button"
          (click)="tabChange.emit('services')"
          [class]="
            activeTab() === 'services'
              ? 'bg-white text-blue-700 font-semibold shadow-xs'
              : 'text-slate-600 hover:bg-white/70 hover:text-slate-900 font-medium'
          "
          class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-xs transition-colors whitespace-nowrap cursor-pointer"
        >
          <i class="pi pi-heart text-xs"></i> {{ t('app.nav.services') }}
          <span
            class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700 font-mono"
            >{{ clanData.services().length }}</span
          >
        </button>
        <button
          type="button"
          (click)="tabChange.emit('matrix')"
          [class]="
            activeTab() === 'matrix'
              ? 'bg-white text-blue-700 font-semibold shadow-xs'
              : 'text-slate-600 hover:bg-white/70 hover:text-slate-900 font-medium'
          "
          class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-xs transition-colors whitespace-nowrap cursor-pointer"
        >
          <i class="pi pi-check-circle text-xs"></i> {{ t('app.nav.matrix') }}
        </button>
        <button
          type="button"
          (click)="tabChange.emit('schedule')"
          [class]="
            activeTab() === 'schedule'
              ? 'bg-white text-blue-700 font-semibold shadow-xs'
              : 'text-slate-600 hover:bg-white/70 hover:text-slate-900 font-medium'
          "
          class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-xs transition-colors whitespace-nowrap cursor-pointer"
        >
          <i class="pi pi-calendar text-xs"></i> {{ t('app.nav.schedule') }}
        </button>
      </nav>

      <div class="flex shrink-0 items-center gap-2">
        <details #shareMenu class="relative">
          <summary
            [attr.aria-label]="t('app.actions.share')"
            class="inline-flex h-9 list-none items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-2 text-xs font-medium text-slate-700 shadow-2xs transition-colors hover:bg-slate-50 cursor-pointer sm:px-3"
          >
            <i class="pi pi-share-alt text-xs" aria-hidden="true"></i>
            <span class="hidden sm:inline">{{ t('app.actions.share') }}</span>
            <i class="pi pi-chevron-down hidden text-[10px] sm:inline" aria-hidden="true"></i>
          </summary>
          <div
            class="absolute right-0 z-40 mt-2 min-w-52 overflow-hidden rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
          >
            <button
              type="button"
              (click)="shareMenu.open = false; openWhatsApp.emit()"
              class="flex w-full items-center gap-2 px-3 py-2 text-left text-xs text-slate-700 hover:bg-slate-50 cursor-pointer"
            >
              <i class="pi pi-whatsapp text-emerald-600" aria-hidden="true"></i>
              {{ t('app.actions.exportWhatsApp') }}
            </button>
            <a
              routerLink="/service-sheets"
              class="flex items-center gap-2 px-3 py-2 text-xs text-slate-700 hover:bg-slate-50"
            >
              <i class="pi pi-print text-slate-500" aria-hidden="true"></i>
              {{ t('sheets.title') }}
            </a>
          </div>
        </details>
        <button
          type="button"
          (click)="openImport.emit()"
          class="hidden h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 shadow-2xs transition-colors hover:bg-slate-50 cursor-pointer lg:inline-flex"
        >
          <i class="pi pi-file-import text-xs text-blue-600"></i>
          <span class="hidden xl:inline">{{ t('app.actions.importData') }}</span>
        </button>
        <a
          routerLink="/settings"
          [attr.title]="t('settings.title')"
          [attr.aria-label]="t('settings.title')"
          class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-300 bg-white px-0 text-xs font-medium text-slate-700 shadow-2xs transition-colors hover:bg-slate-50 xl:w-auto xl:gap-1.5 xl:px-3"
        >
          <i class="pi pi-cog text-xs" aria-hidden="true"></i>
          <span class="hidden xl:inline">{{ t('settings.title') }}</span>
        </a>
      </div>
    </div>

    <!-- Mobile Sub-bar -->
    <div
      class="flex items-center gap-1 overflow-x-auto border-t border-slate-100 py-2 lg:hidden"
    >
      <button
        type="button"
        (click)="tabChange.emit('dashboard')"
        [class]="
          activeTab() === 'dashboard'
            ? 'bg-white text-blue-700 font-semibold shadow-xs'
            : 'text-slate-600 hover:bg-white/70 hover:text-slate-900'
        "
        class="h-9 shrink-0 rounded-lg px-3 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.dashboard') }}
      </button>
      <button
        type="button"
        (click)="tabChange.emit('members')"
        [class]="
          activeTab() === 'members'
            ? 'bg-white text-blue-700 font-semibold shadow-xs'
            : 'text-slate-600 hover:bg-white/70 hover:text-slate-900'
        "
        class="h-9 shrink-0 rounded-lg px-3 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.members') }} ({{ clanData.members().length }})
      </button>
      <button
        type="button"
        (click)="tabChange.emit('services')"
        [class]="
          activeTab() === 'services'
            ? 'bg-white text-blue-700 font-semibold shadow-xs'
            : 'text-slate-600 hover:bg-white/70 hover:text-slate-900'
        "
        class="h-9 shrink-0 rounded-lg px-3 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.services') }} ({{ clanData.services().length }})
      </button>
      <button
        type="button"
        (click)="tabChange.emit('matrix')"
        [class]="
          activeTab() === 'matrix'
            ? 'bg-white text-blue-700 font-semibold shadow-xs'
            : 'text-slate-600 hover:bg-white/70 hover:text-slate-900'
        "
        class="h-9 shrink-0 rounded-lg px-3 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.matrix') }}
      </button>
      <button
        type="button"
        (click)="tabChange.emit('schedule')"
        [class]="
          activeTab() === 'schedule'
            ? 'bg-white text-blue-700 font-semibold shadow-xs'
            : 'text-slate-600 hover:bg-white/70 hover:text-slate-900'
        "
        class="h-9 shrink-0 rounded-lg px-3 text-xs whitespace-nowrap cursor-pointer"
      >
        {{ t('app.nav.schedule') }}
      </button>
    </div>
  </div>
</header>
