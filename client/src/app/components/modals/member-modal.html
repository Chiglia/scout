<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs" *transloco="let t">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900">
        {{ formData.id ? t('members.editMember') : t('members.addMember') }}
      </h3>
      <button type="button" (click)="close.emit()" class="text-slate-400 hover:text-slate-700 cursor-pointer">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Nome *</label>
          <input type="text" [(ngModel)]="formData.name" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="es. Matteo" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Cognome</label>
          <input type="text" [(ngModel)]="formData.surname" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="es. Rossi" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Ruolo</label>
          <select [(ngModel)]="formData.role" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800">
            <option value="novizio">Novizio/a</option>
            <option value="rover">Rover</option>
            <option value="scolta">Scolta</option>
          </select>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Anno di Clan</label>
          <select [(ngModel)]="formData.year" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800">
            <option [ngValue]="1">1° Anno</option>
            <option [ngValue]="2">2° Anno</option>
            <option [ngValue]="3">3° Anno</option>
            <option [ngValue]="4">4° Anno / Partenza</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Telefono</label>
          <input type="tel" [(ngModel)]="formData.phone" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="+39 340 1234567" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Email</label>
          <input type="email" [(ngModel)]="formData.email" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="nome@clan.it" />
        </div>
      </div>

      <div>
        <label class="block font-medium text-slate-700 mb-1">Note / Mezzo di trasporto / Preferenze</label>
        <textarea rows="2" [(ngModel)]="formData.notes" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="es. Automunito, preferisce disabilità o infanzia..."></textarea>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
      <button type="button" (click)="close.emit()" class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer">
        {{ t('common.cancel') }}
      </button>
      <button type="button" (click)="submit()" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-2xs cursor-pointer">
        {{ t('common.save') }}
      </button>
    </div>
  </div>
</div>
