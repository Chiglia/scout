<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs" *transloco="let t">
  <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <h3 class="text-base font-bold text-slate-900">
        {{ formData.id ? t('services.editService') : t('services.addService') }}
      </h3>
      <button type="button" (click)="close.emit()" class="text-slate-400 hover:text-slate-700 cursor-pointer">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-medium text-slate-700 mb-1">Nome Servizio *</label>
        <input type="text" [(ngModel)]="formData.name" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="es. Mensa dei Poveri Caritas" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Ente / Realtà</label>
          <input type="text" [(ngModel)]="formData.organization" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="es. Caritas Diocesana" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Categoria</label>
          <select [(ngModel)]="formData.category" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800">
            <option value="children">Infanzia / Doposcuola</option>
            <option value="elderly">Anziani</option>
            <option value="poverty">Povertà / Cucine</option>
            <option value="disability">Disabilità</option>
            <option value="health">Salute / Pronto Soccorso</option>
            <option value="environment">Ambiente</option>
            <option value="parish">Comunità / Parrocchia</option>
            <option value="other">Altro</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Luogo / Indirizzo</label>
          <input type="text" [(ngModel)]="formData.location" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="es. Via Roma 10" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Posti Richiesti</label>
          <input type="number" min="1" max="10" [(ngModel)]="formData.requiredCapacity" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-medium text-slate-700 mb-1">Referente</label>
          <input type="text" [(ngModel)]="formData.contactPerson" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="Don Paolo" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Telefono</label>
          <input type="tel" [(ngModel)]="formData.contactPhone" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" placeholder="+39 02 123456" />
        </div>
      </div>

      <!-- Schedule Slots -->
      <div class="pt-2 border-t border-slate-100">
        <span class="block font-bold text-slate-800 mb-2">Fasce Orarie Richieste:</span>
        <div class="space-y-1.5 mb-3">
          @for (slot of formData.scheduleSlots; track $index) {
            <div class="flex items-center justify-between p-2 rounded-lg bg-slate-100 border border-slate-200 text-xs">
              <span class="font-semibold text-slate-800">{{ getDayLabel(slot.day) }} {{ slot.startTime }} - {{ slot.endTime }}</span>
              <button type="button" (click)="removeSlot($index)" class="text-red-500 hover:text-red-700 p-1 cursor-pointer"><i class="pi pi-trash text-xs"></i></button>
            </div>
          }
        </div>

        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-0.5">Giorno</label>
              <select [(ngModel)]="newSlotDay" class="w-full p-1.5 bg-white border border-slate-300 rounded text-xs">
                @for (d of days; track d.id) { <option [value]="d.id">{{ d.labelIt }}</option> }
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-0.5">Inizio</label>
              <input type="time" [(ngModel)]="newSlotStart" class="w-full p-1.5 bg-white border border-slate-300 rounded text-xs" />
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-0.5">Fine</label>
              <input type="time" [(ngModel)]="newSlotEnd" class="w-full p-1.5 bg-white border border-slate-300 rounded text-xs" />
            </div>
          </div>
          <button type="button" (click)="addSlot()" class="w-full py-1.5 bg-white border border-slate-300 hover:bg-slate-100 rounded text-xs font-semibold text-slate-700 cursor-pointer">+ Aggiungi Turno</button>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
      <button type="button" (click)="close.emit()" class="px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg cursor-pointer">{{ t('common.cancel') }}</button>
      <button type="button" (click)="submit()" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-2xs cursor-pointer">{{ t('common.save') }}</button>
    </div>
  </div>
</div>
